name: Android CI Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          echo "Accepting SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "Ensuring platform 36 and build-tools are installed..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env configuration for CI
        run: |
          cat > .env << 'EOF'
          MAPS_API_KEY=placeholder_maps_api_key_ci_build
          FIREBASE_APPCHECK_DEBUG_TOKEN=placeholder_appcheck_debug_token_ci_build
          EOF
          echo "✓ Generated local .env file with safe placeholders for CI build"

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "✓ Decoded debug.keystore from debug.keystore.base64 file"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -keyalg RSA -keysize 2048 \
              -validity 10000 -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "✓ Generated new development debug keystore for CI"
          else
            echo "✓ Reusing existing debug keystore file"
          fi

      - name: Set up Release Signing Credentials
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "✓ Configured signing credentials from GitHub secrets"
          elif [ -f "my-upload-key.jks" ]; then
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "✓ Release keystore already exists in workspace"
          else
            echo "Generating fallback signing keystore for release evaluation..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 \
              -validity 10000 -alias upload \
              -storepass android -keypass android \
              -dname "CN=Android Release,O=SmartOSM,C=TH"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "✓ Fallback signing configuration registered"
          fi

      - name: Run Unit Tests
        run: |
          echo "Running Robolectric and Local Unit Tests..."
          gradle testDebugUnitTest --stacktrace --no-daemon
        env:
          MAPS_API_KEY: placeholder_maps_api_key_ci_build
        continue-on-error: true

      - name: Build Debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug'
        run: |
          echo "Assembling debug app build..."
          gradle assembleDebug --stacktrace --no-daemon
        env:
          MAPS_API_KEY: placeholder_maps_api_key_ci_build

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
        run: |
          echo "Assembling release app build with safe signing configurations..."
          gradle assembleRelease --stacktrace --no-daemon
        env:
          MAPS_API_KEY: placeholder_maps_api_key_ci_build

      - name: Archive Debug APK Artifacts
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug') && success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Archive Release APK Artifacts
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Archive Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
